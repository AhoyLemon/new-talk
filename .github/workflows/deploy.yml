name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A talk freshly generated from the template has Pages switched off, and configure-pages fails until someone sets Settings → Pages → Source to GitHub Actions. Skip quietly until then; test.yml still runs the gate.
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Stage Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/demos
          cp index.html favicon.ico og-image.png _site/
          cp -r css js reveal svg video favicons img _site/
          cp demos/*.html _site/demos/
          cp -r demos/css demos/js _site/demos/
          if [ -d demos/img ]; then cp -r demos/img _site/demos/; fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
